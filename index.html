<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f1e9" />
    <meta name="description" content="五输穴子母补泻与韩国舍岩针法的移动端视觉参考工具" />
    <link id="appIcon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⭐%3C/text%3E%3C/svg%3E" />
    <title>AcuGuide · 五输穴与舍岩针法</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <div class="app-shell">
      <main id="main-content">
        <section aria-labelledby="pageTitle">
          <h1 class="sr-only" id="pageTitle">五输穴子母补泻与韩国舍岩针法参考</h1>
          <div class="meridian-selector" id="meridianSelector" role="toolbar" aria-label="选择经脉"></div>
          <figure class="element-chart" aria-labelledby="chartCaption">
            <svg id="elementChart" viewBox="0 -75 360 410" role="img" aria-label="五行生克关系图及对应穴位"></svg>
            <figcaption id="chartCaption">
              <span><i class="legend-dot is-self"></i>本</span>
              <span><i class="legend-dot is-mother"></i>母</span>
              <span><i class="legend-dot is-child"></i>子</span>
              <span><i class="legend-dot is-controller"></i>克我</span>
            </figcaption>
          </figure>
          <div class="meridian-grid" id="meridianGrid" aria-live="polite"></div>
        </section>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
